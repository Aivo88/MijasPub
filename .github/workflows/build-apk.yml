name: Build MijasPub APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'version.json'
      - 'bg.jpg'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'header-default.png'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing keystore
        run: |
          echo "" > /tmp/ks.b64
          base64 -d /tmp/ks.b64 > android/app/debug.keystore
          ls -la android/app/debug.keystore

      - name: Generate launcher icons from icon-512.png
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          for pair in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $pair
            dir="android/app/src/main/res/mipmap-$1"
            mkdir -p "$dir"
            convert icon-512.png -resize ${2}x${2} "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done

      - name: Bundle web app into APK assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html sw.js manifest.json version.json bg.jpg icon-192.png icon-512.png header-default.png android/app/src/main/assets/
          ls -la android/app/src/main/assets/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SaunaMijas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-present: error
